name: E-Commerce UI Automation CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  automation-tests:
    name: Run Selenium TestNG Automation Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the project source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 JDK with automatic Maven dependency caching
      - name: Set up Java 21 Development Kit
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Display Java, Maven, and Google Chrome versions for pipeline debugging
      - name: Display Environment Versions
        run: |
          echo "=== JAVA VERSION ==="
          java -version
          echo "=== MAVEN VERSION ==="
          mvn -version
          echo "=== CHROME VERSION ==="
          google-chrome --version

      # Step 4: Execute full Selenium TestNG suite in headless mode
      - name: Execute Headless TestNG Automation Suite
        run: mvn clean test -Dheadless=true

      # Step 5: Upload Surefire TestNG XML & HTML reports
      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # Step 6: Upload raw Allure result JSON files
      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 14

      # Step 7: Upload test failure PNG screenshots (only triggered when tests fail)
      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 14
